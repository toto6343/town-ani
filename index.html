<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Have a Good Day - Enhanced Animation</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poiret+One&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script defer src="js/ie.js"></script>
</head>
<body>
  <div class="loading" id="loading">Loading...</div>
  <div class="stars" id="stars"></div>
  
  <div class="time-display" id="timeDisplay">
    Dawn · 06:00
  </div>

  <h1 id="greeting">Have a Good Day!!</h1>
  
  <section>	
    <article class="sky">			
      <img src="img/sun.png" class="sun" alt="Sun" loading="lazy" />
      <img src="img/cloud1.png" class="cloud1" alt="Cloud" loading="lazy" />
      <img src="img/cloud2.png" class="cloud2" alt="Cloud" loading="lazy" />
    </article>	
    
    <article class="town">
      <img src="img/circle.png" class="circle" alt="Circle" loading="lazy" />
      <img src="img/town_night.png" class="night" alt="Night Town" loading="lazy" />
      <img src="img/town_day.png" class="day" alt="Day Town" loading="lazy" />	
    </article>
    
    <article class="people">
      <img src="img/man.png" class="man" alt="Man walking" loading="lazy" />
      <img src="img/family.png" class="family" alt="Family walking" loading="lazy" />
    </article>			
  </section>

  <div class="controls">
    <button class="control-btn" id="pauseBtn">⏸ Pause</button>
    <button class="control-btn" id="speedBtn">⚡ Speed Up</button>
    <button class="control-btn" id="resetBtn">🔄 Reset</button>
  </div>

  <script src="js/le.js"/>
</body>
</html>
